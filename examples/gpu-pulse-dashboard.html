<script>
const $ = id => document.getElementById(id);
const path = location.pathname;
const reportData = $('report-data').textContent;
const usedByNode = !reportData && path.startsWith('/gpu/');
const metricsURL = usedByNode ? '/api/v1/gpus/' + path.slice(5) : '';
$('back').hidden = !usedByNode;
const compute = [
  ['tensor_tflops', 'Tensor Core (provisional)', 'TFLOP/s', '#7cc7fc'],
  ['cuda_fp32_tflops', 'CUDA FP32', 'TFLOP/s', '#d0a5ef']
];
const dram = [
  ['dram_read_gbps', 'DRAM Read', 'GB/s', '#70e0b8'],
  ['dram_write_gbps', 'DRAM Write', 'GB/s', '#eca77a']
];
const cache = [
  ['l1_hit_pct', 'L1/TEX Hit', '%', '#7cc7fc'],
  ['l2_hit_pct', 'L2 Hit', '%', '#f5d18d']
];
const format = (value, unit) => Number.isFinite(value)
  ? value.toLocaleString('en-US', {maximumFractionDigits: 2}) + (unit ? ' ' + unit : '')
  : 'N/A';

function createCards(group, fields) {
  return fields.map(([key, label, unit]) => {
    const card = document.createElement('div');
    const title = document.createElement('small');
    const value = document.createElement('b');
    card.className = 'card';
    title.textContent = label;
    value.textContent = 'N/A';
    card.append(title, value);
    $(group).append(card);
    return [key, value, unit];
  });
}
const computeCards = createCards('compute-cards', compute);
const memoryCards = createCards('memory-cards', [...dram, ...cache, ['peak', 'DRAM Bandwidth Peak', 'GB/s'], ['memory_mib', 'Total VRAM', 'MiB']]);
function updateCards(cards, values) {
  for (const [key, element, unit] of cards) element.textContent = format(values[key], unit);
}

function createChart(group, title, lines, fixedMax) {
  const box = document.createElement('div');
  const caption = document.createElement('small');
  const canvas = document.createElement('canvas');
  canvas.className = 'chart';
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', title);
  caption.textContent = title;
  for (const [, label, , color] of lines) {
    const key = document.createElement('span');
    key.className = 'key';
    key.style.backgroundColor = color;
    caption.append(key, label);
  }
  box.append(caption, canvas);
  $(group).append(box);
  return {canvas, lines, fixedMax};
}
const charts = [
  createChart('compute-charts', 'Recent compute · TFLOP/s', compute),
  createChart('memory-charts', 'Recent DRAM · GB/s', dram),
  createChart('memory-charts', 'Recent cache hit rate · %', cache, 100)
];

function draw({canvas, lines, fixedMax}, samples) {
  const {clientWidth: width, clientHeight: height} = canvas;
  if (width <= 60 || height <= 40) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const left = 45, right = width - 12, top = 12, bottom = height - 24;
  const values = samples.flatMap(s => lines.map(([key]) => s.measurements?.[key]).filter(Number.isFinite));
  const max = fixedMax || values.reduce((max, value) => Math.max(max, value), 1) * 1.14;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#9fb0c5';
  ctx.textAlign = 'right';
  for (let tick = 0; tick <= 4; tick++) {
    const y = top + (bottom - top) * tick / 4;
    ctx.strokeStyle = '#34445a';
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    ctx.fillText(format(max * (4 - tick) / 4), left - 5, y + 4);
  }
  const stamp = (sample) => sample.gpu_end_ns ?? sample.host_received_ns;
  const first = samples.length && stamp(samples[0]);
  const last = samples.length && stamp(samples.at(-1));
  const timed = Number.isFinite(first) && Number.isFinite(last) && last > first;
  for (const [key, , , color] of lines) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    let previous = null;
    samples.forEach((sample, i) => {
      const value = sample.measurements?.[key];
      if (!Number.isFinite(value)) {
        previous = null;
        return;
      }
      const progress = timed && Number.isFinite(stamp(sample))
        ? (stamp(sample) - first) / (last - first) : i / Math.max(1, samples.length - 1);
      const x = left + (right - left) * progress;
      const y = bottom - value / max * (bottom - top);
      ctx.beginPath();
      if (previous) {
        ctx.moveTo(...previous);
        ctx.lineTo(x, y);
      } else {
        ctx.arc(x, y, 2, 0, 2 * Math.PI);
      }
      ctx.stroke();
      previous = [x, y];
    });
  }
  ctx.textAlign = 'left';
  ctx.fillText(`${samples.length} points${timed ? ` · ${format((last - first) / 1e9)} s` : ''}`, left, bottom + 17);
}

function updatePrecision(comparisons) {
  const rows = Object.entries(comparisons).map(([key, record]) =>
    [key, format(record.measured, record.unit) + (record.counter_unit_verified === false && Number.isFinite(record.measured) ? ' (provisional)' : ''), format(record.peak, record.unit) + (record.peak_origin === 'DERIVED' ? ' (derived)' : ''), format(record.attainment_pct, '%')]
  );
  if (!rows.length) rows.push(['No precision metrics available', 'N/A', 'N/A', 'N/A']);
  $('precision').replaceChildren(...rows.map(values => {
    const row = document.createElement('tr');
    for (const value of values) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.append(cell);
    }
    return row;
  }));
}

async function getJSON(url) {
  const response = await fetch(url, {cache: 'no-store'});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

let latestSamples = [];
function render(data, samples) {
  const {gpu, collector} = data;
  $('title').textContent = gpu.model || (gpu.cuda_index == null ? 'GPU Detail' : `GPU ${gpu.cuda_index} Detail`);
  $('meta').textContent = [
    gpu.uuid, gpu.pci_bus_id && 'PCI ' + gpu.pci_bus_id, collector?.chip,
    data.sku || data.peak_status, collector?.status === 'PROFILER_BUSY' ? 'Another profiler is using the counters' : collector?.status || 'UNKNOWN'
  ].filter(Boolean).join(' · ');
  $('error').textContent = collector?.last_error || '';
  updateCards(computeCards, data.measurements);
  updateCards(memoryCards, {
    ...data.measurements, peak: data.memory_bandwidth_peak_gbps, memory_mib: gpu.memory_mib
  });
  updatePrecision(data.compute);
  latestSamples = samples;
  for (const chart of charts) draw(chart, latestSamples);
  $('diagnostics').textContent = JSON.stringify({
    collector, peak_source: data.peak_source, raw_metrics: data.raw_metrics,
    last_host_received_ns: data.last_host_received_ns
  }, null, 2);
}

async function refresh() {
  try {
    const [data, history] = usedByNode
      ? await Promise.all([getJSON(metricsURL + '/metrics'), getJSON(metricsURL + '/history?view=chart')])
      : [await getJSON('/api/detail?view=chart')];
    render(data, (history || data).samples);
  } catch (error) {
    $('error').textContent = 'Dashboard disconnected: ' + error.message;
  } finally {
    setTimeout(refresh, usedByNode ? 2000 : 700);
  }
}
window.addEventListener('resize', () => charts.forEach(chart => draw(chart, latestSamples)));
if (reportData) {
  const report = JSON.parse(reportData);
  render(report, report.samples);
} else {
  refresh();
}
</script>
</body>
</html>
