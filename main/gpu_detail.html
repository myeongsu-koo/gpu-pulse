<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Pulse · Detail</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:1100px;margin:0 auto;padding:26px;background:#0b1220;color:#e6edf8;font:14px system-ui}h1{font-size:23px}h2{font-size:17px}a{color:#80c7ff}p,small{color:#9fb0c5}section{border:1px solid #29394d;background:#111c2a;margin:16px 0;padding:18px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #29394d}th{color:#a7bad0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#172638;padding:13px}.card label{font-size:12px;color:#a7bad0}.card b{display:block;font-size:22px}pre{white-space:pre-wrap;word-break:break-all;color:#a5bad3}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><a href="/">← Node Summary</a><h1 id="title">GPU DETAIL</h1><p id="meta"></p><section><h2>Compute · Precision</h2><p>Dense theoretical reference, when the exact SKU can be matched. An unverified sparsity path is not a proven peak comparison.</p><table><thead><tr><th>Precision</th><th>Measured</th><th>Peak</th><th>Attainment</th></tr></thead><tbody id="compute"></tbody></table></section><section><h2>Memory</h2><div class="cards" id="memory"></div></section><section><h2>Collector / Metric provenance</h2><pre id="diagnostics"></pre></section>
<script>
const uuid=decodeURIComponent(location.pathname.slice(5)),$=id=>document.getElementById(id),f=x=>Number.isFinite(x)?Number(x).toFixed(2):'N/A';
function row(parts){let tr=document.createElement('tr');for(let p of parts){let td=document.createElement('td');td.textContent=String(p??'N/A');tr.append(td)}return tr}
async function refresh(){try{let d=await fetch('/api/v1/gpus/'+encodeURIComponent(uuid)+'/metrics').then(r=>r.json());$('title').textContent='GPU DETAIL · '+d.gpu.model;$('meta').textContent=d.gpu.uuid+' · PCI '+d.gpu.pci_bus_id+' · SKU '+(d.sku||d.peak_status)+' · '+d.collector.status;let c=$('compute');c.replaceChildren();for(let [k,m] of Object.entries(d.compute||{})){c.append(row([k,f(m.measured)+' '+(m.unit||''),f(m.peak)+' '+(m.unit||''),f(m.attainment_pct)+'%']))}let mem=$('memory');mem.replaceChildren();for(let [key,label,unit] of [['dram_read_gbps','DRAM Read','GB/s'],['dram_write_gbps','DRAM Write','GB/s'],['l1_hit_pct','L1 Hit','%'],['l2_hit_pct','L2 Hit','%']]){let x=document.createElement('div');x.className='card';let l=document.createElement('label');l.textContent=label;let b=document.createElement('b');b.textContent=f(d.measurements[key]);let u=document.createElement('small');u.textContent=unit;x.append(l,b,u);mem.append(x)}$('diagnostics').textContent=JSON.stringify({collector:d.collector,peak_source:d.peak_source,raw_metrics:d.raw_metrics,last_host_received_ns:d.last_host_received_ns},null,2)}catch(e){$('diagnostics').textContent=String(e)}}
refresh();setInterval(refresh,2000);
</script></body></html>
